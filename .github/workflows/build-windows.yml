name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "build/windows/ffmpeg.exe"

      - name: Download Node.js runtime
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.19.5/node-v20.19.5-win-x64.zip" -OutFile "$env:RUNNER_TEMP\node.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\node.zip" -DestinationPath "$env:RUNNER_TEMP\node" -Force
          $node = Get-ChildItem "$env:RUNNER_TEMP\node" -Recurse -Filter node.exe | Select-Object -First 1
          Copy-Item $node.FullName "build/windows/node.exe"

      - name: Build portable EXE
        run: |
          pyinstaller --clean --noconfirm build/windows/YouTubeDownloader.spec
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\YouTubeDownloader.exe release\YouTubeDownloader.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build\windows\installer.iss"
          Copy-Item build\windows\dist\YouTubeDownloader-Setup.exe release\YouTubeDownloader-Setup.exe

      - name: Create portable ZIP
        shell: powershell
        run: |
          Compress-Archive -Path release\YouTubeDownloader.exe -DestinationPath release\YouTubeDownloader-Portable.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/YouTubeDownloader.exe
            release/YouTubeDownloader-Portable.zip
            release/YouTubeDownloader-Setup.exe
          generate_release_notes: true
